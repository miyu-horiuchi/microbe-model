[cerebrium.deployment]
name = "embed"
python_version = "3.11"
docker_base_image_url = "nvidia/cuda:12.1.1-runtime-ubuntu22.04"
disable_auth = false
include = ['./*', 'main.py', 'cerebrium.toml', 'markers.hmm']
exclude = ['.*', '__pycache__', '*.pyc']

[cerebrium.hardware]
cpu = 4.0
memory = 16.0
compute = "ADA_L4"
gpu_count = 1
region = "us-east-1"

[cerebrium.scaling]
min_replicas = 0
max_replicas = 3
cooldown = 120
replica_concurrency = 1
scaling_metric = "concurrency_utilization"
scaling_target = 80
response_grace_period = 600

[cerebrium.dependencies.pip]
torch = ">=2.2"
transformers = ">=4.40"
accelerate = ">=0.30"
pyhmmer = ">=0.12"
pyrodigal = ">=3.5"
requests = ">=2.32"
numpy = ">=1.26"
